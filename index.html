<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplicación de la robótica · Unidad 3 · CTP Mercedes Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#ECEFF5; --line:#D5DCE7; --line-2:#C3CCDA;
  --ink:#14203A; --muted:#55657F; --faint:#7A889E;
  --accent:#6A3DD8; --accent-ink:#FFFFFF; --accent-dim:rgba(106,61,216,.10); --accent-line:rgba(106,61,216,.35);
  --teal:#0E8C81; --teal-dim:rgba(14,140,129,.10);
  --amber:#A8520B; --amber-dim:rgba(168,82,11,.09); --amber-line:rgba(168,82,11,.35);
  --ok:#137A45; --ok-dim:rgba(19,122,69,.10); --bad:#B42335; --bad-dim:rgba(180,35,53,.09);
  --hero:#101A2E; --hero-ink:#E8EDF6; --hero-muted:#A9B6CC; --hero-line:rgba(160,180,215,.18);
  --shadow:0 1px 2px rgba(20,32,58,.06), 0 6px 18px rgba(20,32,58,.06);
  --r-lg:16px; --r:12px; --r-sm:8px;
  --f-display:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1322; --surface:#141C2E; --surface-2:#1B2539; --line:#27324A; --line-2:#34415C;
    --ink:#E6EBF4; --muted:#A3B0C6; --faint:#7F8CA4;
    --accent:#A98BFA; --accent-ink:#140B2E; --accent-dim:rgba(169,139,250,.13); --accent-line:rgba(169,139,250,.40);
    --teal:#3DD3C2; --teal-dim:rgba(61,211,194,.12);
    --amber:#F0A855; --amber-dim:rgba(240,168,85,.10); --amber-line:rgba(240,168,85,.40);
    --ok:#4ADE8B; --ok-dim:rgba(74,222,139,.12); --bad:#FB7185; --bad-dim:rgba(251,113,133,.12);
    --hero:#0A1020; --hero-line:rgba(160,180,215,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#141C2E; --surface-2:#1B2539; --line:#27324A; --line-2:#34415C;
  --ink:#E6EBF4; --muted:#A3B0C6; --faint:#7F8CA4;
  --accent:#A98BFA; --accent-ink:#140B2E; --accent-dim:rgba(169,139,250,.13); --accent-line:rgba(169,139,250,.40);
  --teal:#3DD3C2; --teal-dim:rgba(61,211,194,.12);
  --amber:#F0A855; --amber-dim:rgba(240,168,85,.10); --amber-line:rgba(240,168,85,.40);
  --ok:#4ADE8B; --ok-dim:rgba(74,222,139,.12); --bad:#FB7185; --bad-dim:rgba(251,113,133,.12);
  --hero:#0A1020; --hero-line:rgba(160,180,215,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);}
*,*::before,*::after{box-sizing:inherit;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
img,svg{max-width:100%;}
code,.mono{font-family:var(--f-mono);}
a{color:var(--accent);}

/* ---------- Header + tabs ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1;}
.brand-mark{flex:0 0 36px;height:36px;border-radius:10px;background:var(--accent-dim);border:1px solid var(--accent-line);display:grid;place-items:center;color:var(--accent);}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.2;letter-spacing:-.01em;}
.brand-txt span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.theme-btn{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13px;}
.theme-btn:hover{border-color:var(--accent-line);}
.tabs{max-width:1120px;margin:0 auto;padding:8px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;border:0;background:none;padding:9px 13px 11px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--ink);}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab .tn{font-family:var(--f-mono);font-size:12px;margin-right:4px;}

main{max-width:1120px;margin:0 auto;padding:26px 18px 70px;}
.view{display:none;}
.view.on{display:block;}
.view.on .anim-in{animation:rise .35s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view.on .anim-in{animation:none}}

h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.015em;line-height:1.2;}
h2.sec{font-size:clamp(22px,3.2vw,28px);margin:44px 0 6px;}
.sec-lead{color:var(--muted);margin:0 0 18px;max-width:68ch;}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:34px 34px 30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center;isolation:isolate;}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(100deg,#000 0%,rgba(0,0,0,.35) 70%);-webkit-mask-image:linear-gradient(100deg,#000 0%,rgba(0,0,0,.35) 70%);}
.hero-kicker{font-size:14px;color:var(--hero-muted);margin:0 0 10px;}
.hero h1{font-size:clamp(34px,6vw,58px);margin:0 0 14px;line-height:1.02;font-weight:700;color:#fff;}
.hero p.lead{color:var(--hero-muted);max-width:52ch;margin:0 0 22px;font-size:16.5px;}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--hero-muted);}
.hero-facts b{color:#fff;font-weight:600;}
.gears{width:100%;max-width:380px;justify-self:end;}
.gears .g1{transform-origin:150px 150px;}
.gears .g2{transform-origin:286px 112px;}
.gears .g3{transform-origin:258px 246px;}
@media (prefers-reduced-motion: no-preference){
  .gears .g1{animation:spin 14s linear infinite;}
  .gears .g2{animation:spin 9.33s linear infinite reverse;}
  .gears .g3{animation:spin 7s linear infinite reverse;}
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:26px 20px 24px}.gears{max-width:220px;justify-self:center;order:-1;margin-bottom:-6px}}

/* ---------- Cards ---------- */
.ra-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
@media (max-width:900px){.ra-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:560px){.ra-grid{grid-template-columns:1fr;}}
.ra-card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--shadow);transition:border-color .15s, transform .15s;}
.ra-card:hover{border-color:var(--accent-line);transform:translateY(-2px);}
.ra-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ra-num{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-dim);border-radius:6px;padding:3px 8px;}
.ra-hours{font-size:12.5px;color:var(--muted);}
.ra-card h3{margin:0;font-size:19px;}
.ra-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.5;}
.ra-card .go{margin-top:auto;font-size:13.5px;font-weight:600;color:var(--accent);padding-top:4px;}
.ra-icon{width:42px;height:42px;color:var(--accent);}

.close-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
@media (max-width:980px){.close-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:560px){.close-grid{grid-template-columns:1fr;}}
.close-card{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:18px;}
.close-card:hover{border-color:var(--accent-line);}
.close-card h3{margin:0 0 4px;font-size:17px;}
.close-card p{margin:0;font-size:13.5px;color:var(--muted);}
.close-card .ic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;}

/* ---------- RA page ---------- */
.ra-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 24px 22px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:6px 20px;}
.ra-head .ra-icon{width:58px;height:58px;grid-row:span 3;}
.ra-head .ra-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);}
.ra-head h1{margin:2px 0 0;font-size:clamp(25px,4vw,34px);}
.ra-head .enun{margin:4px 0 0;font-size:15.5px;color:var(--muted);max-width:75ch;}
.ra-head .enun b{color:var(--ink);font-weight:600;}
@media (max-width:620px){.ra-head{grid-template-columns:1fr;padding:20px 18px}.ra-head .ra-icon{grid-row:auto;width:46px;height:46px}}

.res-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
@media (max-width:980px){.res-row{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:520px){.res-row{grid-template-columns:1fr;}}
.res-btn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;}
.res-btn:hover:not([disabled]){border-color:var(--accent-line);}
.res-btn .ic{flex:0 0 38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:var(--surface-2);}
.res-btn b{display:block;font-size:14.5px;}
.res-btn small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;}
.res-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.res-btn.primary small{color:inherit;opacity:.85;}
.res-btn.primary .ic{background:rgba(255,255,255,.18);}
.res-btn[disabled]{cursor:not-allowed;opacity:.62;}

/* topics */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none;}
.toc a{display:inline-block;font-size:13px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;}
.toc a:hover{border-color:var(--accent-line);color:var(--accent);}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:16px;}
@media (max-width:620px){.topic{padding:20px 16px;}}
.topic-h{display:flex;gap:12px;align-items:baseline;margin-bottom:10px;}
.topic-h .n{font-family:var(--f-mono);font-size:14px;color:var(--accent);font-weight:600;}
.topic-h h3{margin:0;font-size:21px;}
.topic p,.topic li{max-width:76ch;}
.topic p{margin:0 0 12px;}
.topic h4{font-size:16px;margin:20px 0 8px;}
.topic ul,.topic ol{padding-left:22px;margin:0 0 12px;}
.topic li{margin-bottom:5px;}
.tbl-wrap{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:var(--r);}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px;}
table.t th,table.t td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);}
table.t th{background:var(--surface-2);font-weight:600;font-size:13px;}
table.t tr:last-child td{border-bottom:0;}
.box{border-radius:var(--r);padding:13px 16px 13px 16px;margin:12px 0 14px;font-size:15px;border:1px solid;}
.box > b:first-child{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:4px;}
.box p:last-child{margin-bottom:0;}
.box.imp{background:var(--amber-dim);border-color:var(--amber-line);}
.box.imp > b:first-child{color:var(--amber);}
.box.ej{background:var(--teal-dim);border-color:color-mix(in srgb,var(--teal) 40%,transparent);}
.box.ej > b:first-child{color:var(--teal);}
pre.code{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-x:auto;margin:8px 0 14px;}
.fig{margin:8px 0 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;}
.fig svg{max-width:520px;width:100%;height:auto;}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:6px;}

/* autoevaluación */
.qa{display:grid;gap:10px;}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}
.qa summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;font-weight:500;}
.qa summary::-webkit-details-marker{display:none;}
.qa summary .qn{font-family:var(--f-mono);color:var(--accent);font-weight:600;flex:0 0 auto;}
.qa summary .hint{margin-left:auto;flex:0 0 auto;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;}
.qa details[open] summary .hint{color:var(--accent);}
.qa .ans{padding:0 16px 14px 44px;color:var(--muted);font-size:15px;}
.qa .ans b{color:var(--ink);}

.work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
@media (max-width:760px){.work-grid{grid-template-columns:1fr;}}
.work{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px;}
.work h3{margin:0;font-size:18px;}
.work p{margin:0;color:var(--muted);font-size:14.5px;}
.work .chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 16px;font-size:14.5px;font-weight:600;}
.btn:hover:not([disabled]){border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.btn.sm{padding:7px 12px;font-size:13px;}
.work .btn{align-self:flex-start;margin-top:auto;}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:40px 24px;text-align:center;}
.empty h2{margin:6px 0 8px;font-size:24px;}
.empty p{color:var(--muted);max-width:56ch;margin:0 auto 18px;}
.empty .big{font-size:40px;}

.glo-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px);z-index:5;background:var(--bg);padding:14px 0 10px;margin-top:18px;border-bottom:1px solid var(--line);}
#gloQ{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:11px 14px;background:var(--surface);font-size:16px;}
.glo-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:600;}
.chip-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.glo-letters{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;}
.glo-letters button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-family:var(--f-mono);font-size:13px;font-weight:600;padding:0;}
.glo-letters button:disabled{opacity:.3;cursor:default;}
.glo-letters button:not(:disabled):hover{border-color:var(--accent);color:var(--accent);}
.glo-group{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 270px);}
.glo-group h2{font-size:26px;color:var(--accent);margin:26px 0 8px;}
.glo-group dl{margin:0;display:grid;gap:8px;}
.glo-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;}
.glo-item dt{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.glo-item dd{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:80ch;}
.glo-ra{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-dim);border-radius:5px;padding:1px 6px;}
.glo-empty{text-align:center;color:var(--muted);padding:30px 0;}
@media (max-width:620px){.glo-tools{position:static;}.glo-group{scroll-margin-top:120px;}}
.stands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
@media (max-width:1060px){.stands{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (max-width:860px){.stands{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:520px){.stands{grid-template-columns:1fr;}}
.stand{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;}
.stand b{display:block;font-size:14.5px;line-height:1.3;}
.stand small{display:block;font-size:12.5px;color:var(--muted);}
.stand .act-n{flex:0 0 34px;}

/* frases */
.frase{margin:40px auto 6px;max-width:760px;text-align:center;padding:22px 24px;border-radius:var(--r-lg);background:var(--accent-dim);border:1px solid var(--accent-line);}
.frase p{margin:0 0 8px;font-family:var(--f-display);font-size:clamp(18px,2.6vw,22px);font-weight:600;line-height:1.35;color:var(--ink);}
.frase cite{font-style:normal;font-size:13.5px;color:var(--muted);}
/* antología */
.map-q{background:var(--hero);color:var(--hero-ink);border-radius:var(--r-lg);padding:22px 26px;margin-bottom:14px;}
.map-q small{color:var(--tealLt,#3DD3C2);font-size:13px;}
.map-q p{margin:6px 0 0;font-family:var(--f-display);font-size:clamp(20px,3vw,27px);font-weight:700;color:#fff;line-height:1.25;}
.stars{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);}
.stars span{line-height:1.35;}
.ant-ra{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;margin-top:22px;scroll-margin-top:140px;}
@media (max-width:620px){.ant-ra{padding:20px 16px;}}
.ant-h{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px;}
.ant-h .ra-icon{flex:0 0 50px;height:50px;}
.ant-h h2{margin:6px 0 4px;font-size:clamp(22px,3vw,28px);}
.ant-h p{margin:0;color:var(--muted);font-size:14.5px;max-width:75ch;}
.ant-ra h3{font-size:17px;margin:20px 0 8px;}
.ant-ideas{margin:0;padding-left:22px;}
.ant-ideas li{margin-bottom:6px;max-width:80ch;}
/* juego */
.game-hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:30px 32px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center;}
.game-hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px;color:#fff;line-height:1.05;}
.game-hero .lead{color:var(--hero-muted);max-width:56ch;margin:0 0 20px;}
.vs{font-size:clamp(28px,4.5vw,44px);text-align:center;line-height:1.5;letter-spacing:4px;}
.vs span{display:block;font-family:var(--f-display);font-weight:700;color:#F0A855;font-size:22px;letter-spacing:.1em;}
@media (max-width:760px){.game-hero{grid-template-columns:1fr;padding:24px 20px;}}
.rules,.rivals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
@media (max-width:860px){.rules,.rivals{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:520px){.rules,.rivals{grid-template-columns:1fr;}}
.rule,.rival{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;}
.rule>span,.rival .ri{font-size:26px;flex:0 0 36px;text-align:center;}
.rule b,.rival b{display:block;font-size:15px;}
.rule small,.rival small{display:block;font-size:13px;color:var(--muted);line-height:1.35;}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;}
.fighter{display:flex;align-items:center;gap:10px;min-width:0;}
.fighter.rv{justify-content:flex-end;text-align:right;}
.fighter .fi{font-size:clamp(36px,7vw,54px);transition:transform .2s;}
.fighter .fi.hit{animation:hitfx .4s;}
@keyframes hitfx{0%{transform:scale(1)}30%{transform:scale(.8) rotate(-12deg);filter:brightness(2)}100%{transform:scale(1)}}
.fbody{flex:1;min-width:0;}
.fighter b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fighter small{display:block;font-size:12px;color:var(--muted);}
.hp{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:5px 0 3px;}
.hp i{display:block;height:100%;background:var(--ok);transition:width .4s;}
.rvhp i{background:var(--bad);margin-left:auto;}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;}
.timer{position:relative;width:62px;height:62px;}
.timer svg{width:100%;height:100%;transform:rotate(-90deg);}
.timer .tb{fill:none;stroke:var(--surface-2);stroke-width:4;}
.timer .tf{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer.low .tf{stroke:var(--bad);}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:18px;}
.streak{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 10px;white-space:nowrap;}
.streak.hot{color:#fff;background:var(--amber);}
.shake{animation:shake .45s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.shake,.fighter .fi.hit{animation:none}}
.gprog{text-align:center;font-size:13.5px;color:var(--muted);margin:12px 0;}
.gq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;}
.gq .q{font-size:clamp(17px,2.4vw,20px);font-weight:600;margin:0 0 14px;}
.gopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
@media (max-width:620px){.gopts{grid-template-columns:1fr;}.arena{grid-template-columns:1fr 1fr;}.mid{grid-column:1/-1;grid-row:1;flex-direction:row;justify-content:center;}}
.gopts .opt{padding:13px 14px;font-size:15.5px;}
#gMute{min-width:0;}
.cert-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;}
.cert-wrap canvas{width:100%;height:auto;display:block;border-radius:6px;}
#printCert{display:none;}
@media print{body.printing>*:not(#printCert){display:none!important;}body.printing #printCert{display:block!important;}#printCert img{width:100%;}@page{size:landscape;margin:8mm;}}
footer.site{border-top:1px solid var(--line);margin-top:30px;padding:22px 18px 30px;text-align:center;font-size:13px;color:var(--muted);}

/* ================= COTIDIANO ================= */
.cot{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;}
.cot.on{display:flex;}
.cot-bar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;}
.cot-bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.cot-title{flex:1;min-width:0;}
.cot-title small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width:480px){.close-btn{min-width:0;padding:8px 11px;}.score-pill{padding:5px 9px;font-size:13px;}}
.cot-title b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.score-pill{flex:0 0 auto;font-family:var(--f-mono);font-size:14px;font-weight:600;background:var(--accent-dim);color:var(--accent);border-radius:999px;padding:6px 12px;white-space:nowrap;}
.close-btn{flex:0 0 auto;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;min-width:86px;transition:background .15s,color .15s,border-color .15s;}
.close-btn.confirm{background:var(--bad);border-color:var(--bad);color:#fff;}
.cot-tabs{max-width:980px;margin:6px auto 0;display:flex;gap:4px;}
.cot-tabs .tab{font-size:14.5px;}
.cot-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 60px);}
.cot-in{max-width:980px;margin:0 auto;}
.cot-intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;}
.cot-intro h2{margin:0 0 6px;font-size:21px;}
.cot-intro p{margin:0 0 8px;color:var(--muted);font-size:15px;}
.cot-intro .mission{background:var(--accent-dim);border:1px solid var(--accent-line);border-radius:var(--r);padding:12px 14px;color:var(--ink);font-size:15px;margin-top:10px;}
.name-gate{margin-top:14px;background:var(--amber-dim);border:1px solid var(--amber-line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.name-gate label{font-weight:700;font-size:15px;}
.name-gate .gate-row{display:flex;gap:8px;flex-wrap:wrap;}
.name-gate input{flex:1 1 220px;border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;background:var(--surface);font-size:16px;}
.name-gate small{font-size:13px;color:var(--muted);}
.name-gate small.err{color:var(--bad);font-weight:600;}
.name-gate.ok{background:var(--ok-dim);border-color:var(--ok);}
.name-gate.ok span{font-size:16px;}
#cotWork.locked{opacity:.4;pointer-events:none;filter:grayscale(.4);user-select:none;}
.cot-progress{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);margin:10px 0 0;}
.cot-progress .bar{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.cot-progress .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s;}

.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px;overflow:hidden;}
.act-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line);}
.act-n{flex:0 0 34px;height:34px;border-radius:9px;background:var(--accent-dim);color:var(--accent);font-family:var(--f-mono);font-weight:600;display:grid;place-items:center;font-size:14px;}
.act-ttl{flex:1;min-width:0;}
.act-ttl small{display:block;font-size:12.5px;color:var(--muted);}
.act-ttl b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.3;}
.act-pts{flex:0 0 auto;font-family:var(--f-mono);font-size:13.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:4px 9px;}
.act.done .act-pts{color:var(--ok);background:var(--ok-dim);}
.act-b{padding:14px 18px 18px;}
.caso{font-size:14.5px;background:var(--surface-2);border-left:3px solid var(--teal);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 13px;margin:0 0 14px;}
.caso b{color:var(--teal);}
.inst{font-size:14px;color:var(--muted);margin:0 0 12px;}

.item{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
.item .q{font-weight:500;margin:0 0 9px;}
.opts{display:grid;gap:7px;}
.opt{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 12px;font-size:14.5px;line-height:1.4;}
.opt:hover:not([disabled]){border-color:var(--accent);}
.opt[disabled]{cursor:default;}
.opt.ok,.cell.ok,.wl.ok{background:var(--ok-dim);border-color:var(--ok);color:var(--ink);}
.opt.bad,.cell.bad,.wl.bad{background:var(--bad-dim);border-color:var(--bad);}
.opt.sel{border-color:var(--accent);background:var(--accent-dim);}
.fb{font-size:13.5px;margin-top:9px;padding:8px 11px;border-radius:8px;display:none;}
.fb.show{display:block;}
.fb.ok{background:var(--ok-dim);color:var(--ink);}
.fb.bad{background:var(--bad-dim);color:var(--ink);}
.fb b{margin-right:4px;}
.row2{display:flex;flex-wrap:wrap;gap:8px;}
.row2 .opt{flex:1 1 120px;text-align:center;}
select.sel{max-width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:14px;}
select.sel.ok{border-color:var(--ok);background:var(--ok-dim);}
select.sel.bad{border-color:var(--bad);background:var(--bad-dim);}
.match-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;}
.match-row .l{font-weight:500;font-size:14.5px;}
.match-row select{width:100%;}
@media (max-width:620px){.match-row{grid-template-columns:1fr;}}
.fill-line{line-height:2.1;font-size:15px;}
.fill-line select{margin:0 3px;}
.cls-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;}
.cls-item .t{flex:1 1 240px;font-size:14.5px;font-weight:500;}
.cls-item .bts{display:flex;flex-wrap:wrap;gap:6px;}
.cls-item .opt{padding:6px 11px;font-size:13.5px;}
.order-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:7px;}
.order-list li{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;background:var(--surface);}
.order-list li .pos{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:600;flex:0 0 20px;}
.order-list li .tx{flex:1;font-size:14.5px;}
.order-list li .mv{display:flex;gap:4px;}
.order-list li .mv button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-size:15px;}
.order-list li.ok{border-color:var(--ok);background:var(--ok-dim);}
.order-list li.bad{border-color:var(--bad);background:var(--bad-dim);}
.check-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.multi-opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;font-size:14.5px;cursor:pointer;}
.multi-opt input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);}
.multi-opt.ok{border-color:var(--ok);background:var(--ok-dim);}
.multi-opt.bad{border-color:var(--bad);background:var(--bad-dim);}
.multi-opt.miss{border-color:var(--amber);border-style:dashed;}
.num-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.num-row input{width:130px;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--surface);font-family:var(--f-mono);}
.num-row input.ok{border-color:var(--ok);background:var(--ok-dim);}
.num-row input.bad{border-color:var(--bad);background:var(--bad-dim);}
.num-row .unit{font-size:14px;color:var(--muted);}
.label-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:720px){.label-wrap{grid-template-columns:1fr;}}
.label-fig{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;}
.label-fig svg{width:100%;height:auto;display:block;}
.label-list .match-row{grid-template-columns:auto 1fr;}
.mk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:13px;font-weight:700;}
.ws{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:18px;align-items:start;}
@media (max-width:720px){.ws{grid-template-columns:1fr;}}
.ws-grid{display:grid;gap:3px;user-select:none;touch-action:manipulation;justify-content:start;}
.ws-grid .cell{width:clamp(25px,7.6vw,33px);height:clamp(25px,7.6vw,33px);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:clamp(12px,3.6vw,15px);border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0;}
.ws-grid .cell.start{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.ws-grid .cell.found{background:var(--ok-dim);border-color:var(--ok);}
.ws-words{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;}
.ws-words .w{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;}
.ws-words .w.found{text-decoration:line-through;color:var(--ok);border-color:var(--ok);background:var(--ok-dim);}
.ws-msg{font-size:13.5px;color:var(--muted);margin-top:10px;min-height:20px;}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
@media (max-width:560px){.mem{grid-template-columns:repeat(3,minmax(0,1fr));}}
.mem button{min-height:86px;border:1px solid var(--line-2);border-radius:10px;background:var(--accent-dim);font-size:13.5px;line-height:1.3;padding:8px;color:transparent;position:relative;}
.mem button::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--accent);}
.mem button.up{background:var(--surface);color:var(--ink);}
.mem button.up::after,.mem button.ok::after{content:none;}
.mem button.ok{background:var(--ok-dim);border-color:var(--ok);color:var(--ink);}
.mem-stats{font-size:13.5px;color:var(--muted);margin-top:10px;}
.grid-tbl td.c,.grid-tbl th.c{text-align:center;}
.grid-tbl input{width:19px;height:19px;accent-color:var(--accent);}
.grid-tbl td.ok{background:var(--ok-dim);}
.grid-tbl td.bad{background:var(--bad-dim);}
.code-lines{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--f-mono);font-size:13.5px;}
.code-lines button{display:flex;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface-2);padding:8px 12px;white-space:pre-wrap;}
.code-lines button:last-child{border-bottom:0;}
.code-lines button .ln{color:var(--faint);flex:0 0 18px;}
.code-lines button:hover:not([disabled]){background:var(--accent-dim);}
.code-lines button.ok{background:var(--ok-dim);}
.code-lines button.bad{background:var(--bad-dim);}
.code-lines button[disabled]{cursor:default;}

/* resultado */
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);}
.result-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;}
@media (max-width:560px){.result-top{grid-template-columns:1fr;}}
.ring{width:132px;height:132px;position:relative;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
.ring .val b{font-family:var(--f-display);font-size:36px;line-height:1;display:block;}
.ring .val small{font-size:12px;color:var(--muted);}
.lvl{display:inline-block;font-weight:700;font-size:14px;border-radius:8px;padding:4px 10px;}
.lvl.ini{background:var(--bad-dim);color:var(--bad);}
.lvl.int{background:var(--amber-dim);color:var(--amber);}
.lvl.ava{background:var(--ok-dim);color:var(--ok);}
.name-field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.name-field label{font-size:13px;font-weight:600;}
.name-field input{border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;background:var(--surface);font-size:16px;}
.name-field input.missing{border-color:var(--amber);background:var(--amber-dim);}
.res-meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;}
.res-meta b{color:var(--ink);font-weight:600;}
.breakdown{margin-top:18px;}
.breakdown table{min-width:0;}
.rub td{font-size:13.5px;}
.rub td.hit{background:var(--accent-dim);box-shadow:inset 0 0 0 2px var(--accent);font-weight:600;color:var(--ink);}
.rub-details{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:4px 16px;}
.rub-details summary{cursor:pointer;font-weight:600;padding:12px 0;color:var(--accent);}
.rub-details[open]{padding-bottom:14px;}
.rub-h{margin:20px 0 4px;font-size:18px;}
.rub-note{font-size:13.5px;color:var(--muted);margin:0 0 8px;}
.steps-teams{margin-top:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:14px;}
.steps-teams ol{margin:6px 0 0;padding-left:20px;}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;}
.toast.on{opacity:1;}
.confetti{position:fixed;top:-12px;width:9px;height:9px;z-index:400;pointer-events:none;}
</style>

id:"ra1",n:1,icon:"auto",horas:8,
short:"Automatización robotizada",
resumen:"Qué es automatizar con robots, cómo perciben, razonan y actúan, y dónde se usa en Costa Rica.",
enunciado:"Discriminar los principios y usos de la automatización robotizada empleada en procesos de producción y bienestar social.",
temas:[
{t:"Concepto de automatización robotizada",html:`
<p>La <b>automatización robotizada</b> es el uso de máquinas y sistemas que ejecutan tareas de forma <b>autónoma</b> (sin ayuda) o <b>semiautónoma</b> (con algo de supervisión), reduciendo la intervención humana directa. No se trata de “máquinas que piensan como personas”, sino de sistemas diseñados para repetir un trabajo con rapidez, precisión y seguridad.</p>
<p>Automatizar no significa lo mismo que mecanizar. Una máquina <b>mecanizada</b> ayuda a la persona, pero la persona sigue decidiendo cada movimiento (por ejemplo, un taladro eléctrico). Un sistema <b>automatizado</b> decide por sí mismo cuándo y cómo actuar a partir de información del entorno.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Nivel</th><th>Quién decide</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td>Manual</td><td>La persona hace y decide todo</td><td>Llenar botellas de agua a mano</td></tr>
<tr><td>Mecanizado</td><td>La persona decide; la máquina aporta la fuerza</td><td>Una moledora de café que se enciende con un botón</td></tr>
<tr><td>Semiautomático</td><td>La máquina hace la tarea; la persona inicia o supervisa</td><td>Una lavadora que necesita que alguien elija el ciclo</td></tr>
<tr><td>Automático</td><td>El sistema percibe, decide y actúa solo</td><td>Una línea de empaque que detecta y aparta productos defectuosos</td></tr>
</tbody></table></div>
<div class="box imp"><b>⚠️ Importante</b><p>Un sistema es <b>robotizado</b> cuando usa un robot (una máquina programable con sensores y actuadores) para realizar la tarea automatizada.</p></div>`},
{t:"Características: percepción, razonamiento y acción",html:`
<p>Todo sistema robotizado sigue el mismo ciclo, que se repite muchas veces por segundo:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Etapa</th><th>Qué hace</th><th>Componente que la realiza</th></tr></thead><tbody>
<tr><td><b>Percepción</b></td><td>Capta información del entorno (distancia, luz, temperatura, peso, imagen)</td><td>Sensores</td></tr>
<tr><td><b>Razonamiento</b></td><td>Procesa la información y toma una decisión según su programa</td><td>Controlador (placa, computadora, PLC)</td></tr>
<tr><td><b>Acción</b></td><td>Ejecuta un movimiento o tarea física</td><td>Actuadores (motores, pinzas, válvulas)</td></tr>
</tbody></table></div>
<p>Además de ese ciclo, la automatización robotizada tiene otras características: <b>repetibilidad</b> (hace la misma tarea igual miles de veces), <b>precisión</b> (comete muy pocos errores de medida), <b>velocidad</b>, <b>flexibilidad</b> (se puede reprogramar para otra tarea) y <b>trabajo continuo</b> (puede operar 24 horas).</p>
<div class="box ej"><b>💡 Ejemplo</b><p>Una aspiradora robótica en una casa de Heredia <b>percibe</b> una pared con su sensor de choque, <b>razona</b> que debe cambiar de dirección y <b>actúa</b> girando sus ruedas hacia otro lado.</p></div>`},
{t:"Campo de acción",html:`
<p>El <b>campo de acción</b> abarca tres grandes áreas: la <b>productiva</b> (manufactura, agricultura, construcción, logística, minería), la de <b>servicios</b> (comercio, banca, transporte, telecomunicaciones) y la <b>social</b> (salud, educación, asistencia a personas mayores, gestión pública). Dentro de ellas, conviene automatizar cuando la tarea es:</p>
<ul><li><b>Repetitiva:</b> se hace igual muchas veces (empacar, soldar, etiquetar).</li><li><b>Peligrosa:</b> expone a las personas a riesgos (pintura con químicos, cargas pesadas, alta temperatura).</li><li><b>De alta precisión:</b> exige medidas exactas (ensamble de dispositivos médicos).</li><li><b>Continua:</b> necesita operar día y noche (bombeo de agua, monitoreo).</li></ul>
<div class="box imp"><b>⚠️ Importante</b><p>Automatizar también tiene límites: el costo inicial es alto, requiere mantenimiento y personal capacitado, y puede cambiar los puestos de trabajo. Por eso se analiza cada caso antes de decidir.</p></div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Ventajas</th><th>Desventajas</th></tr></thead><tbody>
<tr><td>Mayor productividad y calidad constante</td><td>Inversión inicial alta</td></tr>
<tr><td>Menos accidentes en tareas peligrosas</td><td>Necesita mantenimiento y repuestos</td></tr>
<tr><td>Trabajo continuo, sin cansancio</td><td>Requiere personal técnico capacitado</td></tr>
<tr><td>Registro exacto de datos de producción</td><td>Puede reemplazar puestos de tareas repetitivas</td></tr>
</tbody></table></div>`},
{t:"Procesos y tecnologías de la automatización",html:`
<p>Un <b>proceso</b> es la secuencia de pasos para obtener un producto o servicio. La automatización robotizada se apoya en varias <b>tecnologías</b>:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Tecnología</th><th>Para qué sirve</th></tr></thead><tbody>
<tr><td>Sensores</td><td>Medir lo que pasa en el proceso (presencia, peso, temperatura)</td></tr>
<tr><td>Controladores y PLC</td><td>Decidir qué hacer según un programa (el PLC es una computadora industrial muy resistente)</td></tr>
<tr><td>Brazos robóticos industriales</td><td>Soldar, pintar, ensamblar o mover piezas</td></tr>
<tr><td>Robots colaborativos (cobots)</td><td>Trabajar al lado de personas, con sensores que los detienen si alguien se acerca</td></tr>
<tr><td>Vehículos guiados (AGV)</td><td>Transportar materiales dentro de una bodega sin conductor</td></tr>
<tr><td>Visión artificial</td><td>Revisar productos con cámaras y detectar defectos</td></tr>
<tr><td>Bandas transportadoras</td><td>Mover productos de una etapa a otra del proceso</td></tr>
<tr><td>Inteligencia artificial</td><td>Aprender patrones y mejorar las decisiones con la experiencia</td></tr>
<tr><td>IoT y nube</td><td>Conectar máquinas y sensores por internet y guardar sus datos para analizarlos</td></tr>
</tbody></table></div>
<div class="box ej"><b>💡 Ejemplo</b><p>En una planta de dispositivos médicos de una zona franca de Heredia, una cámara (visión artificial) revisa cada pieza, el controlador decide si cumple la medida y un brazo robótico aparta las defectuosas de la banda transportadora.</p></div>`},
{t:"Usos en la industria y la empresa",html:`
<p>En la <b>industria</b>, la automatización robotizada se usa principalmente en procesos de producción: ensamble, soldadura, pintura, empaque, paletizado (acomodar cajas en tarimas) y control de calidad.</p>
<p>En la <b>empresa</b> (comercio y servicios), se automatizan tareas logísticas y administrativas: bodegas con robots que buscan productos, cajas de autoservicio, clasificación de paquetes y software que procesa facturas automáticamente (automatización robótica de procesos o RPA).</p>
<div class="box ej"><b>💡 Ejemplo</b><p>Una cooperativa lechera puede usar llenadoras automáticas que dosifican la misma cantidad en cada envase, y un robot paletizador que acomoda las cajas para su distribución por todo el país.</p></div>`},
{t:"Usos en el hogar, la educación y el bienestar social",html:`
<div class="tbl-wrap"><table class="t"><thead><tr><th>Ámbito</th><th>Usos frecuentes</th><th>Beneficio principal</th></tr></thead><tbody>
<tr><td><b>Hogar</b></td><td>Aspiradoras robóticas, cortacésped automáticos, luces y cerraduras inteligentes</td><td>Comodidad y ahorro de tiempo</td></tr>
<tr><td><b>Educación</b></td><td>Kits de robótica, robots para aprender a programar, laboratorios con simuladores</td><td>Aprender haciendo y resolver retos</td></tr>
<tr><td><b>Bienestar social</b></td><td>Robots de cirugía asistida, prótesis robóticas, robots de rehabilitación, sillas de ruedas inteligentes</td><td>Salud, accesibilidad y calidad de vida</td></tr>
</tbody></table></div>
<div class="box imp"><b>⚠️ Importante</b><p>En bienestar social, el robot <b>apoya</b> al profesional: en una cirugía asistida, quien decide y controla es el médico; el robot aporta precisión y movimientos más pequeños.</p></div>
<div class="box ej"><b>💡 Ejemplo</b><p>En muchos colegios técnicos de Costa Rica se usan kits de robótica educativa para que el estudiantado programe robots que siguen líneas o esquivan obstáculos.</p></div>`}
],

id:"ra2",n:2,icon:"mec",horas:16,
short:"Mecanismos y máquinas",
resumen:"Piezas que transmiten y transforman el movimiento, y cómo se combinan para diseñar y construir máquinas.",
enunciado:"Aplicar conceptos relacionados con componentes y funciones del proceso mecanizado.",
temas:[
{t:"Mecanismos y máquinas: concepto",html:`
<p>Un <b>mecanismo</b> es un conjunto de piezas que <b>transmiten</b> o <b>transforman</b> un movimiento o una fuerza. Por ejemplo, un engranaje o una polea.</p>
<p>Una <b>máquina</b> combina uno o más mecanismos para realizar un <b>trabajo útil</b>: levantar, cortar, mover, mezclar. Toda máquina tiene tres partes funcionales:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Parte</th><th>Función</th><th>En una bicicleta</th></tr></thead><tbody>
<tr><td><b>Elemento motor</b></td><td>Aporta la energía o fuerza de entrada</td><td>Las piernas sobre los pedales</td></tr>
<tr><td><b>Mecanismo de transmisión</b></td><td>Lleva o cambia el movimiento</td><td>Plato, cadena y piñón</td></tr>
<tr><td><b>Elemento receptor</b></td><td>Recibe el movimiento y realiza el trabajo</td><td>La rueda trasera</td></tr>
</tbody></table></div>
<div class="box imp"><b>⚠️ Importante</b><p>Un mecanismo por sí solo no siempre hace un trabajo útil; una máquina sí, porque organiza los mecanismos hacia un objetivo.</p></div>`},
{t:"Tipos de mecanismos",html:`
<p>Los mecanismos se clasifican según lo que hacen con el movimiento. Recordá los tres tipos de movimiento: <b>rotativo</b> (gira, como una rueda), <b>lineal</b> (avanza en línea recta, como un cajón) y <b>alternativo</b> (va y viene, como un pistón).</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Tipo</th><th>Qué hace</th><th>Ejemplos</th></tr></thead><tbody>
<tr><td><b>De transmisión lineal</b></td><td>Lleva un movimiento lineal o una fuerza de un punto a otro</td><td>Palanca, polea</td></tr>
<tr><td><b>De transmisión circular</b></td><td>Lleva un giro de un eje a otro</td><td>Engranajes, poleas con correa, cadena y piñón, ruedas de fricción</td></tr>
<tr><td><b>De transformación</b></td><td>Cambia un tipo de movimiento en otro</td><td>Piñón-cremallera (giro ↔ lineal), biela-manivela (giro ↔ alternativo), leva (giro → alternativo), tornillo-tuerca (giro → lineal)</td></tr>
</tbody></table></div>
<div class="box ej"><b>💡 Ejemplo</b><p>El portón eléctrico de una casa usa un motor que gira y un <b>piñón-cremallera</b> que transforma ese giro en el movimiento lineal que abre el portón.</p></div>`},
{t:"Características y componentes",html:`
<p>Los mecanismos se construyen con <b>componentes</b> (también llamados operadores mecánicos). Cada uno cumple una función específica:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Componente</th><th>Función</th></tr></thead><tbody>
<tr><td>Eje</td><td>Barra sobre la que giran ruedas o engranajes; transmite el giro</td></tr>
<tr><td>Engranaje</td><td>Rueda dentada que transmite giro a otra rueda dentada sin deslizar</td></tr>
<tr><td>Polea</td><td>Rueda con canal por donde pasa una cuerda o correa</td></tr>
<tr><td>Correa o banda</td><td>Une dos poleas lejanas para transmitir el giro</td></tr>
<tr><td>Cadena</td><td>Une un plato y un piñón; transmite fuerza grande sin deslizar</td></tr>
<tr><td>Palanca</td><td>Barra rígida que gira sobre un punto de apoyo y amplifica la fuerza</td></tr>
<tr><td>Leva</td><td>Pieza de forma irregular que, al girar, empuja a otra hacia arriba y abajo</td></tr>
<tr><td>Rodamiento</td><td>Reduce la fricción entre un eje y su soporte</td></tr>
</tbody></table></div>
<p>Al elegir mecanismos se observan sus <b>características</b>: el tipo de movimiento de entrada y de salida, la velocidad, la fuerza que soportan y si pueden deslizar (una correa puede patinar; un engranaje no).</p>`},
{t:"Usos de los mecanismos",html:`
<p>Los mecanismos tienen tres usos principales:</p>
<ol><li><b>Transmitir movimiento:</b> llevarlo de un lugar a otro (la cadena de la bicicleta).</li><li><b>Transformar movimiento:</b> cambiar su tipo (la leva que abre las válvulas de un motor).</li><li><b>Amplificar o reducir la fuerza o la velocidad:</b> lograr más fuerza con menos esfuerzo (una palanca) o más velocidad (engranajes multiplicadores).</li></ol>
<div class="box ej"><b>💡 Ejemplo</b><p>En un trapiche tradicional de caña en Grecia, los bueyes o un motor hacen girar unos cilindros mediante engranajes; los cilindros aprietan la caña y extraen el jugo.</p></div>
<div class="box imp"><b>⚠️ Importante</b><p>En los procesos mecanizados de la industria, las bandas transportadoras (poleas y correas), los brazos con engranajes y las prensas con levas trabajan juntos para automatizar tareas.</p></div>`},
{t:"Diseño de máquinas a partir de mecanismos",html:`
<p>Diseñar una máquina es combinar mecanismos de forma coherente para lograr un trabajo útil. Se sigue un proceso ordenado:</p>
<ol><li><b>Definir el objetivo:</b> qué problema resuelve la máquina.</li><li><b>Identificar el movimiento:</b> qué movimiento hay a la entrada y cuál se necesita a la salida.</li><li><b>Seleccionar los mecanismos</b> adecuados para lograr ese cambio.</li><li><b>Dibujar un boceto</b> con las piezas, medidas y conexiones.</li><li><b>Elegir los materiales</b> (cartón, madera, plástico, kit de robótica).</li><li><b>Construir y probar</b> el prototipo.</li><li><b>Mejorar</b> lo que no funcionó.</li></ol>
<div class="box ej"><b>💡 Ejemplo</b><p>Reto: subir la bandera del colegio con una manivela. Entrada: giro de la manivela. Salida: movimiento lineal vertical. Mecanismo: manivela con eje y una polea fija arriba del asta.</p></div>`},
{t:"Construcción de componentes mecánicos",html:`
<p>Al construir, se pasa del boceto a la pieza real. Algunas recomendaciones:</p>
<ul><li>Medir dos veces antes de cortar y marcar los centros de los ejes.</li><li>Verificar que los engranajes encajen sin quedar flojos ni trabados.</li><li>Usar ejes rectos y bien fijos para que las ruedas no “bailen”.</li><li>Probar cada mecanismo por separado antes de unirlos todos.</li><li>Trabajar con herramientas en buen estado y anteojos de seguridad.</li></ul>
<h4>Materiales y procesos de fabricación</h4>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Material</th><th>Ventaja</th><th>Uso típico</th></tr></thead><tbody>
<tr><td>Metales (acero, aluminio, bronce)</td><td>Resistencia y durabilidad</td><td>Ejes, engranajes, estructuras</td></tr>
<tr><td>Polímeros (nylon, PVC)</td><td>Livianos, baratos, no se oxidan</td><td>Engranajes pequeños y silenciosos, bujes</td></tr>
<tr><td>Compuestos (fibra de carbono o de vidrio)</td><td>Muy resistentes y livianos</td><td>Brazos robóticos, equipo deportivo</td></tr>
</tbody></table></div>
<p>Las piezas se fabrican por <b>fundición</b> (metal fundido en un molde), <b>mecanizado</b> (torno y fresadora quitan material), <b>soldadura y conformado</b>, o <b>impresión 3D</b> para prototipos; luego se verifican medidas con calibrador en el <b>control de calidad</b>.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Problema al probar</th><th>Causa probable</th><th>Solución</th></tr></thead><tbody>
<tr><td>Los engranajes se saltan dientes</td><td>Ejes demasiado separados</td><td>Acercar los ejes hasta que los dientes encajen</td></tr>
<tr><td>La correa patina</td><td>Correa floja</td><td>Tensarla o usar una más corta</td></tr>
<tr><td>La rueda gira torcida</td><td>Eje doblado o mal centrado</td><td>Cambiar o centrar el eje</td></tr>
</tbody></table></div>`}
],

short:"Máquinas simples y compuestas",
resumen:"Las seis máquinas simples, cómo se combinan y qué efectos producen en velocidad, fuerza y acople.",
enunciado:"Evaluar el uso de máquinas simples y compuestas en la resolución de retos específicos.",
temas:[
{t:"Máquinas simples y compuestas",html:`
<p>Una <b>máquina simple</b> realiza un trabajo con un solo elemento y facilita una tarea cambiando la <b>fuerza</b>, la <b>dirección</b> o la <b>distancia</b>. Una <b>máquina compuesta</b> combina dos o más máquinas simples que trabajan juntas.</p>
<p>La idea clave es la <b>ventaja mecánica</b>: una máquina permite mover una carga grande con una fuerza pequeña, pero “cobra” ese beneficio en distancia o tiempo. Nada es gratis: si hacés menos fuerza, recorrés más distancia.</p>
<div class="box imp"><b>⚠️ Importante</b><p>Las máquinas no crean energía: solo la reorganizan. Menos fuerza implica más recorrido, y más velocidad implica menos fuerza.</p></div>`},
{t:"Características para la transmisión del movimiento",html:`
<p>Cuando una máquina transmite movimiento, hay que observar tres efectos:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Efecto</th><th>Qué significa</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Respecto al tiempo</b> (velocidad)</td><td>La salida puede girar más rápido o más lento que la entrada</td><td>En la bici, una pedalada hace girar la rueda varias veces</td></tr>
<tr><td><b>Respecto al tamaño</b></td><td>La rueda o engranaje <b>pequeño</b> gira <b>más rápido</b>; el <b>grande</b>, más lento pero con más fuerza</td><td>Un plato grande con un piñón pequeño multiplica la velocidad</td></tr>
<tr><td><b>Acople de los operadores</b></td><td>La forma en que se conectan las piezas: <b>acople directo</b> (las piezas se tocan, como dos engranajes) o <b>acople indirecto</b> (con un elemento intermedio, como una correa o cadena)</td><td>En acople directo, dos engranajes giran en sentidos <b>opuestos</b>; con correa abierta o cadena giran en el <b>mismo</b> sentido</td></tr>
</tbody></table></div>
<p>La <b>relación de transmisión</b> compara las vueltas: <b>vueltas del conducido = vueltas del conductor × (dientes del conductor ÷ dientes del conducido)</b>.</p>
<div class="box ej"><b>💡 Ejemplo</b><p>Un engranaje de 30 dientes mueve uno de 10. Por cada vuelta del grande, el pequeño da 30 ÷ 10 = <b>3 vueltas</b>, y gira en sentido contrario.</p></div>`},
{t:"Las seis máquinas simples y su construcción",html:`
<div class="tbl-wrap"><table class="t"><thead><tr><th>Máquina simple</th><th>Qué hace</th><th>Ejemplos cotidianos</th></tr></thead><tbody>
<tr><td><b>Palanca</b></td><td>Barra que gira sobre un punto de apoyo y amplifica la fuerza</td><td>Sube y baja del parque, carretilla, pinzas</td></tr>
<tr><td><b>Plano inclinado</b></td><td>Superficie en pendiente que reduce el esfuerzo para subir una carga</td><td>Rampa de acceso para sillas de ruedas</td></tr>
<tr><td><b>Polea</b></td><td>Rueda con canal que cambia la dirección de la fuerza</td><td>Asta de bandera, pozo con balde</td></tr>
<tr><td><b>Rueda y eje</b></td><td>Facilita el movimiento y el transporte reduciendo el roce</td><td>Carreta, perilla de una puerta</td></tr>
<tr><td><b>Cuña</b></td><td>Dos planos inclinados unidos que separan o cortan</td><td>Hacha, cuchillo, machete</td></tr>
<tr><td><b>Tornillo</b></td><td>Plano inclinado enrollado que convierte giro en avance con gran fuerza</td><td>Tornillo de banco, gato de carro</td></tr>
</tbody></table></div>
<h4>La palanca y sus tres clases</h4>
<figure class="fig">${leverSVG}<figcaption>Palanca de primera clase: el apoyo está entre la carga y la fuerza.</figcaption></figure>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Clase</th><th>Qué queda en el medio</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td>Primera</td><td>El punto de apoyo</td><td>Sube y baja, tijeras</td></tr>
<tr><td>Segunda</td><td>La carga</td><td>Carretilla, cascanueces</td></tr>
<tr><td>Tercera</td><td>La fuerza</td><td>Pinzas, caña de pescar</td></tr>
</tbody></table></div>
<p>Ley de la palanca: <b>fuerza × su distancia al apoyo = carga × su distancia al apoyo</b>. Si el brazo de la fuerza es más largo, se necesita menos fuerza.</p>
<div class="box ej"><b>💡 Ejemplo</b><p>Para levantar 60 kg que están a 0,5 m del apoyo, empujando a 1,5 m del apoyo: F × 1,5 = 60 × 0,5 → F = <b>20 kg</b> de fuerza.</p></div>`},
{t:"Máquinas compuestas y los mecanismos que las integran",html:`
<p>Para entender una máquina compuesta, se identifican las máquinas simples que la forman y la función de cada una.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Máquina compuesta</th><th>Máquinas simples que la integran</th></tr></thead><tbody>
<tr><td>Carretilla</td><td>Palanca (los brazos) + rueda y eje</td></tr>
<tr><td>Tijeras</td><td>Dos palancas + dos cuñas (las hojas)</td></tr>
<tr><td>Sacacorchos de alas</td><td>Tornillo + palancas + piñón-cremallera</td></tr>
<tr><td>Bicicleta</td><td>Ruedas y ejes + palancas (pedales, frenos) + transmisión por cadena</td></tr>
<tr><td>Grúa</td><td>Poleas + palanca (el brazo) + rueda y eje (el tambor del cable)</td></tr>
<tr><td>Abrelatas</td><td>Palanca + cuña + rueda y eje</td></tr>
</tbody></table></div>
<div class="box imp"><b>⚠️ Importante</b><p>Una máquina compuesta resuelve problemas que ninguna de sus partes podría resolver sola. Si falla una de sus máquinas simples, todo el conjunto se ve afectado.</p></div>`},
{t:"Construcción de máquinas compuestas",html:`
<p>Al construir una máquina compuesta, se arma primero cada máquina simple, se prueba por separado y después se <b>acoplan</b>. Es clave revisar:</p>
<ul><li>Que el acople transmita el movimiento en el sentido que necesitás.</li><li>Que el tamaño de las ruedas dé la velocidad o fuerza buscada.</li><li>Que las uniones resistan la carga sin doblarse.</li></ul>
<div class="box ej"><b>💡 Ejemplo</b><p>Una grúa de juguete para la feria científica: una manivela con rueda y eje enrolla el hilo (tambor), una polea en la punta cambia la dirección y el brazo funciona como palanca. Se prueba cada parte y luego se unen.</p></div>`},
{t:"Diseño y construcción para resolver retos",html:`
<p>Evaluar el uso de máquinas en un reto significa decidir <b>cuál</b> conviene y <b>comprobar</b> si funcionó. Pasos sugeridos:</p>
<ol><li>Leer el reto y anotar sus restricciones (peso, distancia, materiales, tiempo).</li><li>Proponer al menos dos soluciones con máquinas simples o compuestas.</li><li>Elegir la mejor con criterios: esfuerzo necesario, seguridad, costo y facilidad de construcción.</li><li>Construir el prototipo.</li><li>Medir: ¿cumplió el reto? ¿cuánto esfuerzo y tiempo requirió?</li><li>Documentar resultados y mejoras.</li></ol>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Reto</th><th>Máquina adecuada</th><th>Por qué</th></tr></thead><tbody>
<tr><td>Subir sacos de café a un camión</td><td>Plano inclinado (rampa)</td><td>Reduce el esfuerzo a cambio de recorrer más distancia</td></tr>
<tr><td>Sacar agua de un pozo profundo</td><td>Polea con manivela</td><td>Cambia la dirección y facilita enrollar la cuerda</td></tr>
<tr><td>Partir leña</td><td>Cuña (hacha)</td><td>Concentra la fuerza para separar la madera</td></tr>
<tr><td>Levantar un carro para cambiar la llanta</td><td>Tornillo (gato)</td><td>Gran fuerza con poco esfuerzo, avanzando poco a poco</td></tr>
</tbody></table></div>`}
],

{q:"Nombrá las seis máquinas simples.",a:"<b>Palanca, plano inclinado, polea, rueda y eje, cuña y tornillo.</b>"},

id:"ra4",n:4,icon:"mot",horas:16,
short:"Motores y simuladores",
resumen:"Control mecánico y eléctrico, circuitos en serie y paralelo, tipos de motores y simuladores para probar antes de construir.",
enunciado:"Analizar el uso de los motores y simuladores por medio de retos específicos.",
temas:[
{t:"Control mecánico y eléctrico",html:`
<p>El <b>control</b> de un sistema automatizado regula <b>cuándo</b> y <b>cómo</b> actúan sus mecanismos. Hay dos formas principales:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th></th><th>Control mecánico</th><th>Control eléctrico</th></tr></thead><tbody>
<tr><td>Cómo regula</td><td>Con piezas físicas: topes, levas, trinquetes, resortes, engranajes</td><td>Con componentes eléctricos: interruptores, pulsadores, relés, sensores, finales de carrera</td></tr>
<tr><td>Ventaja</td><td>Simple, resistente, no necesita electricidad</td><td>Más preciso, fácil de automatizar y de cambiar</td></tr>
<tr><td>Ejemplo</td><td>El tope que detiene una puerta corrediza; la leva de una caja de música</td><td>El sensor que enciende las luces del parqueo al anochecer</td></tr>
</tbody></table></div>
<p>Un <b>final de carrera</b> es un interruptor que se activa cuando una pieza llega a su posición límite: por ejemplo, detiene el motor del portón cuando está totalmente abierto. Un <b>relé</b> es un interruptor que se acciona con una pequeña corriente para controlar otra más grande.</p>
<div class="box imp"><b>⚠️ Importante</b><p>Muchos sistemas combinan ambos controles: un tope mecánico como seguridad y un sensor eléctrico para la operación normal.</p></div>`},
{t:"Elementos de un circuito eléctrico",html:`
<p>Un <b>circuito eléctrico</b> es un camino cerrado por donde circula la corriente. Sus elementos básicos son:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Elemento</th><th>Función</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td>Fuente o generador</td><td>Aporta la energía eléctrica</td><td>Batería, pila, adaptador</td></tr>
<tr><td>Conductor</td><td>Lleva la corriente</td><td>Cables de cobre</td></tr>
<tr><td>Elemento de control</td><td>Abre o cierra el paso de la corriente</td><td>Interruptor, pulsador</td></tr>
<tr><td>Receptor o carga</td><td>Transforma la energía eléctrica en otra (luz, movimiento, sonido)</td><td>Bombillo, LED, motor, zumbador</td></tr>
<tr><td>Protección</td><td>Corta la corriente si hay un exceso</td><td>Fusible, breaker</td></tr>
</tbody></table></div>
<div class="box imp"><b>⚠️ Importante</b><p>Si el circuito está <b>abierto</b> (interruptor apagado o cable cortado), la corriente no circula y los receptores no funcionan.</p></div>`},
{t:"Tipos de circuitos: serie, paralelo y combinado",html:`
<div class="tbl-wrap"><table class="t"><thead><tr><th>Tipo</th><th>Cómo se conecta</th><th>Qué pasa si falla un receptor</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Serie</b></td><td>Los receptores uno tras otro, en un solo camino</td><td>Se abre el circuito y <b>todos se apagan</b></td><td>Las luces navideñas antiguas</td></tr>
<tr><td><b>Paralelo</b></td><td>Cada receptor en su propia rama</td><td>Solo se apaga esa rama; <b>los demás siguen</b></td><td>Los tomacorrientes y luces de una casa</td></tr>
<tr><td><b>Combinado (mixto)</b></td><td>Mezcla partes en serie y partes en paralelo</td><td>Depende de dónde esté la falla</td><td>Un interruptor general en serie que controla varias luces en paralelo</td></tr>
</tbody></table></div>
<p>En serie, los receptores comparten el voltaje de la fuente (cada uno recibe menos y brilla menos). En paralelo, cada rama recibe el voltaje completo.</p>
<div class="box ej"><b>💡 Ejemplo</b><p>En un aula, si se quema un fluorescente y los demás siguen encendidos, las luces están en <b>paralelo</b>. El breaker que apaga toda el aula está en <b>serie</b> con ese conjunto: el circuito completo es <b>combinado</b>.</p></div>`},
{t:"Motores: tipos y usos",html:`
<p>Un <b>motor eléctrico</b> convierte la energía eléctrica en movimiento mecánico de giro. Es el actuador más común en robótica.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Motor</th><th>Cómo funciona</th><th>Usos típicos</th></tr></thead><tbody>
<tr><td><b>Motor DC</b> (corriente continua)</td><td>Gira de forma continua; la velocidad cambia con el voltaje y el sentido se invierte cambiando la polaridad</td><td>Ventiladores, ruedas de robots, juguetes</td></tr>
<tr><td><b>Motorreductor</b></td><td>Motor DC con engranajes que reducen la velocidad y aumentan la fuerza</td><td>Ruedas de robots móviles, portones</td></tr>
<tr><td><b>Motor paso a paso</b></td><td>Avanza en pasos fijos (por ejemplo, 1,8° por paso = 200 pasos por vuelta); control preciso de posición</td><td>Impresoras 3D, escáneres, máquinas CNC</td></tr>
<tr><td><b>Servomotor</b></td><td>Se coloca en un ángulo exacto (normalmente de 0° a 180°) y lo mantiene</td><td>Brazos robóticos, barreras, timones</td></tr>
<tr><td><b>Motor AC</b> (corriente alterna)</td><td>Funciona con la corriente de la casa; potente y duradero</td><td>Lavadoras, bombas de agua, industria</td></tr>
<tr><td><b>Motor hidráulico</b></td><td>Transforma la energía de un fluido a presión (aceite) en movimiento; mucha fuerza</td><td>Excavadoras, grúas, maquinaria pesada</td></tr>
<tr><td><b>Motor neumático</b></td><td>Usa aire comprimido para generar movimiento</td><td>Herramientas industriales, pinzas de líneas automatizadas</td></tr>
</tbody></table></div>
<div class="box ej"><b>💡 Ejemplo</b><p>Una barrera de parqueo en un mall de Escazú usa un <b>servomotor</b>: solo necesita ir a 0° (cerrada) y a 90° (abierta) con exactitud.</p></div>`},
{t:"Simuladores eléctricos e informáticos",html:`
<p>Un <b>simulador</b> es un programa que reproduce el comportamiento de un circuito o sistema <b>antes de construirlo</b>. Permite equivocarse sin dañar componentes ni gastar materiales.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Tipo</th><th>Qué permite</th><th>Ejemplos de herramientas</th></tr></thead><tbody>
<tr><td><b>Simulador eléctrico</b></td><td>Armar circuitos virtuales y medir voltaje y corriente</td><td>Tinkercad Circuits, Proteus, Multisim, LTspice</td></tr>
<tr><td><b>Simulador informático</b></td><td>Además, programar el controlador y ver el comportamiento del robot</td><td>Tinkercad con Arduino, MATLAB/Simulink, Gazebo, RoboDK, Factory I/O</td></tr>
</tbody></table></div>
<h4>Flujo de trabajo con un simulador</h4>
<ol><li>Armar el circuito virtual con sus componentes.</li><li>Escribir o cargar el programa del controlador.</li><li>Iniciar la simulación y observar.</li><li>Medir y detectar errores.</li><li>Corregir y volver a simular.</li><li>Construir el circuito real con el diseño ya probado.</li></ol>
<div class="box imp"><b>⚠️ Importante</b><p>El simulador no reemplaza la construcción: en el mundo real hay cables flojos, baterías gastadas y fricción. Simular reduce errores, pero siempre se prueba el prototipo físico.</p></div>`},
{t:"Selección de circuitos, motores y simuladores para retos",html:`
<p>Para resolver un reto de automatización se decide con criterio:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Necesidad del reto</th><th>Elección adecuada</th></tr></thead><tbody>
<tr><td>Girar continuamente una rueda o un ventilador</td><td>Motor DC o motorreductor</td></tr>
<tr><td>Mover a un ángulo exacto (abrir una compuerta 90°)</td><td>Servomotor</td></tr>
<tr><td>Posicionar con mucha precisión a lo largo de un eje</td><td>Motor paso a paso</td></tr>
<tr><td>Que una falla no apague todo el sistema</td><td>Circuito en paralelo</td></tr>
<tr><td>Detener un movimiento al llegar al límite</td><td>Final de carrera (control eléctrico) o tope (control mecánico)</td></tr>
<tr><td>Probar la lógica y el circuito antes de comprar piezas</td><td>Simulador informático</td></tr>
</tbody></table></div>
<pre class="code">INICIO
  MIENTRAS sistema_encendido
    SI sensor_tren = VERDADERO ENTONCES
      servo_barrera ← 0°      // bajar barrera
      luz_roja ← ENCENDIDA
    SINO
      servo_barrera ← 90°     // subir barrera
      luz_roja ← APAGADA
    FIN SI
  FIN MIENTRAS
FIN</pre>
<div class="box ej"><b>💡 Ejemplo</b><p>El pseudocódigo anterior controla la barrera de un cruce del tren: un sensor detecta el tren, el controlador decide y el servomotor baja la barrera.</p></div>`}
],

id:"ra5",n:5,icon:"tec",horas:16,
short:"Tecnologías robóticas",
resumen:"Sensores, actuadores, controladores, lenguajes de programación e interfaces trabajando juntos en un proceso automatizado.",
enunciado:"Utilizar tecnologías robóticas en procesos automatizados con ayuda de lenguajes de programación, interfaces y dispositivos tecnológicos.",
temas:[
{t:"Tecnologías y sus usos en procesos robotizados",html:`
<p>Un proceso robotizado combina cuatro grupos de tecnologías, que corresponden al ciclo <b>percibir → decidir → actuar</b> más la comunicación entre las partes:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Tecnología</th><th>Función</th><th>Ejemplos</th></tr></thead><tbody>
<tr><td><b>Sensores</b></td><td>Perciben el entorno y lo convierten en señales</td><td>Ultrasónico (distancia), infrarrojo (líneas, obstáculos), LDR (luz), temperatura y humedad, PIR (movimiento), humedad de suelo</td></tr>
<tr><td><b>Controladores</b></td><td>Procesan las señales y deciden según el programa</td><td>Arduino, micro:bit, ESP32, Raspberry Pi, PLC</td></tr>
<tr><td><b>Actuadores</b></td><td>Ejecutan la acción física</td><td>Motores, servomotores, LED, zumbador, relé, bomba de agua, pantalla</td></tr>
<tr><td><b>Comunicación</b></td><td>Conectan las partes entre sí y con las personas</td><td>Cables, Bluetooth, wifi, radiofrecuencia</td></tr>
</tbody></table></div>
<div class="box ej"><b>💡 Ejemplo</b><p>Un sistema de riego para la huerta del colegio: un <b>sensor de humedad</b> mide la tierra, un <b>Arduino</b> decide si hace falta agua, un <b>relé</b> enciende la <b>bomba</b> y un módulo <b>wifi</b> envía un aviso al celular.</p></div>`},
{t:"Tecnologías clave: IA, IoT, visión artificial, nube y sistemas embebidos",html:`
<p>Los robots modernos combinan varias tecnologías que trabajan de forma coordinada:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Tecnología</th><th>Qué aporta al robot</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Inteligencia artificial (IA)</b></td><td>Analizar datos, aprender y decidir de forma autónoma</td><td>Detectar piezas defectuosas y mejorar con cada lote</td></tr>
<tr><td><b>Internet de las cosas (IoT)</b></td><td>Conectar robots y sensores por internet</td><td>Un sensor de humedad que activa el riego desde la nube</td></tr>
<tr><td><b>Visión artificial</b></td><td>Interpretar imágenes con cámaras: objetos, colores, defectos</td><td>Revisar la pintura de un carro en la línea de producción</td></tr>
<tr><td><b>Computación en la nube</b></td><td>Guardar y procesar grandes volúmenes de datos a distancia</td><td>Monitorear desde el celular varios robots de una bodega</td></tr>
<tr><td><b>Sistemas embebidos</b></td><td>Pequeñas computadoras dentro del robot que controlan motores y sensores</td><td>Arduino, ESP32, Raspberry Pi, STM32</td></tr>
</tbody></table></div>
<div class="box imp"><b>⚠️ Importante</b><p>La robótica no reemplaza al ser humano: lo libera de tareas repetitivas o peligrosas para que se enfoque en trabajo creativo y de mayor valor.</p></div>`},
{t:"Sensores y actuadores en detalle",html:`
<p>Los sensores entregan dos tipos de señales: <b>digitales</b> (solo dos valores: hay o no hay, 1 o 0) y <b>analógicas</b> (un rango de valores, como 0 a 1023).</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Sensor</th><th>Qué mide</th><th>Tipo de señal</th><th>Uso</th></tr></thead><tbody>
<tr><td>Pulsador</td><td>Si está presionado</td><td>Digital</td><td>Botón de arranque</td></tr>
<tr><td>PIR</td><td>Movimiento de personas o animales</td><td>Digital</td><td>Alarma, luces de pasillo</td></tr>
<tr><td>Ultrasónico</td><td>Distancia a un objeto</td><td>Se calcula con el tiempo del eco</td><td>Esquivar obstáculos, nivel de un tanque</td></tr>
<tr><td>LDR</td><td>Cantidad de luz</td><td>Analógica</td><td>Encender luces al anochecer</td></tr>
<tr><td>Humedad de suelo</td><td>Agua en la tierra</td><td>Analógica</td><td>Riego automático</td></tr>
<tr><td>Infrarrojo de línea</td><td>Si la superficie es clara u oscura</td><td>Digital o analógica</td><td>Robot sigue-líneas</td></tr>
</tbody></table></div>
<p>Los <b>actuadores</b> son los “músculos” del robot: motores DC (giro continuo), servomotores (ángulo exacto), motores paso a paso (avance por pasos) y cilindros neumáticos (empuje con aire comprimido). La <b>alimentación</b> llega de baterías, fuentes o paneles solares, y la <b>comunicación</b> por módulos wifi, Bluetooth, LoRa o Zigbee.</p>
<div class="box imp"><b>⚠️ Importante</b><p>El controlador no tiene fuerza para mover un motor directamente: usa un <b>driver de motores</b> (puente H) o un <b>relé</b> para manejar corrientes más altas.</p></div>`},
{t:"Lenguajes de programación para robótica",html:`
<p>El lenguaje de programación define el <b>comportamiento</b> del robot: qué hacer con lo que perciben sus sensores.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th></th><th>Programación por bloques</th><th>Programación por texto</th></tr></thead><tbody>
<tr><td>Cómo se escribe</td><td>Se arrastran y encajan bloques visuales</td><td>Se escribe código con una sintaxis exacta</td></tr>
<tr><td>Ideal para</td><td>Empezar a programar y prototipos rápidos</td><td>Proyectos avanzados y más control</td></tr>
<tr><td>Errores de sintaxis</td><td>Casi no ocurren: los bloques solo encajan si son compatibles</td><td>Pueden ocurrir (un paréntesis o punto y coma faltante)</td></tr>
<tr><td>Ejemplos</td><td>Scratch, Blockly, mBlock, MakeCode</td><td>C/C++ (Arduino y hardware), Python (IA y visión), Java (robots en red), MATLAB (simulación)</td></tr>
</tbody></table></div>
<p>Antes de programar, conviene escribir el algoritmo en <b>pseudocódigo</b>:</p>
<pre class="code">INICIO
  MIENTRAS VERDADERO
    distancia ← leer(sensor_ultrasonico)
    SI distancia &lt; 15 ENTONCES
      detener_motores()
      girar_derecha()
    SINO
      avanzar()
    FIN SI
  FIN MIENTRAS
FIN</pre>`},
{t:"Interfaces y controladores",html:`
<p>El <b>controlador</b> es el “cerebro” del sistema: tiene un microcontrolador que ejecuta el programa, <b>entradas</b> donde se conectan los sensores y <b>salidas</b> donde se conectan los actuadores.</p>
<p>Una <b>interfaz</b> es el medio que permite a una persona comunicarse con el sistema robótico. Puede servir para <b>programarlo</b>, <b>controlarlo</b> o <b>monitorearlo</b>:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Interfaz</th><th>Para qué se usa</th></tr></thead><tbody>
<tr><td>Entorno de programación (IDE)</td><td>Escribir, verificar y cargar el programa al controlador</td></tr>
<tr><td>Aplicación móvil por Bluetooth</td><td>Manejar el robot a distancia</td></tr>
<tr><td>Pantalla LCD o tablero de LED</td><td>Mostrar datos: temperatura, distancia, estado</td></tr>
<tr><td>Botones, joystick, teclado</td><td>Dar órdenes directas</td></tr>
<tr><td>Monitor serie</td><td>Ver en la computadora los valores que leen los sensores</td></tr>
<tr><td>Interfaz HMI industrial</td><td>Pantalla táctil de una planta para visualizar, supervisar y configurar el proceso</td></tr>
<tr><td>Panel web (tablero)</td><td>Supervisar el sistema desde internet</td></tr>
</tbody></table></div>
<p>Las partes se comunican mediante protocolos como <b>USB</b>, <b>Bluetooth</b>, <b>wifi</b>, <b>Ethernet</b>, <b>RS-232</b> y <b>CAN Bus</b>. Además de las placas como Arduino o ESP32, en la industria se usa el <b>PLC</b> y, en sistemas complejos, computadoras industriales.</p>
<div class="box ej"><b>💡 Ejemplo</b><p>En la feria científica, un grupo maneja su robot con una app del celular (interfaz de control) y ve la distancia al obstáculo en una pantalla LCD (interfaz de monitoreo).</p></div>`},
{t:"Dispositivos tecnológicos integrados",html:`
<p>Los dispositivos tecnológicos son los elementos físicos que se integran en un sistema robotizado: placas, módulos de sensores, actuadores, fuentes de energía y módulos de comunicación.</p>
<h4>Pasos para poner en marcha un sistema</h4>
<ol><li>Definir qué debe hacer el sistema.</li><li>Elegir sensores, controlador y actuadores.</li><li>Conectar los componentes (primero en simulador o protoboard).</li><li>Programar el comportamiento.</li><li>Cargar el programa por medio de la interfaz.</li><li>Probar, medir y ajustar.</li></ol>
<div class="box imp"><b>⚠️ Importante</b><p>La energía también se planifica: los motores consumen mucho más que el controlador. Muchas veces se usa una batería aparte para los motores.</p></div>
<div class="box ej"><b>💡 Ejemplo</b><p>Un robot sigue-líneas integra sensores infrarrojos, una placa controladora, un driver de motores, dos motorreductores, una batería y, opcionalmente, un módulo Bluetooth para iniciarlo desde el celular.</p></div>`}
],
