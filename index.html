resumen:"Historia y grados de inteligencia de los robots, su diseño, sus aplicaciones por sector y cómo evaluar si funcionan bien.",
enunciado:"Aplicar conceptos relacionados con la robótica en la resolución de retos específicos.",
temas:[
{t:"Robots: concepto e historia",html:`
<p>Un <b>robot</b> es una máquina <b>programable</b> que percibe su entorno con sensores, procesa información con un controlador y actúa sobre el mundo con actuadores. La idea de crear máquinas que se muevan solas es muy antigua:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Época</th><th>Hito</th></tr></thead><tbody>
<tr><td>Siglo I</td><td>Herón de Alejandría describe autómatas movidos por agua, aire y contrapesos</td></tr>
<tr><td>1206</td><td>Al-Jazari diseña autómatas musicales y relojes de agua programables con levas</td></tr>
<tr><td>Siglo XVIII</td><td>Los relojeros Jaquet-Droz construyen autómatas que escriben y dibujan</td></tr>
<tr><td>1920</td><td>Karel Čapek usa por primera vez la palabra <b>robot</b> en su obra de teatro R.U.R.</td></tr>
<tr><td>1942</td><td>Isaac Asimov propone las tres leyes de la robótica en sus cuentos</td></tr>
<tr><td>1961</td><td>Unimate, el primer robot industrial, trabaja en una fábrica de automóviles</td></tr>
<tr><td>1966–1972</td><td>Shakey, el primer robot móvil capaz de razonar sobre sus acciones</td></tr>
<tr><td>1997</td><td>El rover Sojourner explora la superficie de Marte</td></tr>
<tr><td>2000 en adelante</td><td>Robots humanoides, aspiradoras robóticas, drones y robots con inteligencia artificial</td></tr>
</tbody></table></div>
<div class="box imp"><b>⚠️ Importante</b><p>Un <b>autómata</b> repite movimientos fijos gracias a mecanismos; un <b>robot</b> moderno es programable y puede reaccionar a lo que perciben sus sensores.</p></div>`},
{t:"Grados de inteligencia de los robots",html:`
<p>Los robots se clasifican según su capacidad para tomar decisiones e interactuar con el entorno. A mayor nivel, más autonomía.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Nivel</th><th>Cómo se comporta</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>1. Programados</b></td><td>Ejecutan secuencias fijas, sin aprender; muy precisos y repetitivos</td><td>Robot de ensamblaje que suelda siempre el mismo punto</td></tr>
<tr><td><b>2. Adaptativos</b></td><td>Ajustan su comportamiento con sensores y responden a cambios simples</td><td>Aspiradora que esquiva obstáculos, robot sigue-líneas</td></tr>
<tr><td><b>3. Inteligentes</b></td><td>Usan inteligencia artificial para analizar información, aprender patrones y tomar decisiones complejas</td><td>Vehículo autónomo que reconoce peatones</td></tr>
<tr><td><b>4. Autónomos avanzados</b></td><td>Aprenden de forma continua, planifican y se adaptan a entornos cambiantes sin ayuda humana</td><td>Rover que explora Marte</td></tr>
</tbody></table></div>
<div class="box ej"><b>💡 Ejemplo</b><p>Una aspiradora que siempre hace el mismo zigzag sin sensores sería de nivel 1; si esquiva las patas de las sillas es <b>adaptativa</b>; si construye un mapa de la casa y aprende dónde hay más polvo, ya usa <b>inteligencia</b>.</p></div>`},
{t:"Diseño, control y programación de robots",html:`
<p>El diseño robótico avanza en cinco etapas: <b>identificar la necesidad</b>, <b>diseño conceptual</b>, <b>diseño mecánico</b> (chasis, brazos, movilidad), <b>diseño electrónico</b> (controlador, sensores, motores) y <b>diseño de software</b>. En todas ellas se planifican tres aspectos:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Aspecto</th><th>Preguntas que responde</th><th>Ejemplo: robot recolector</th></tr></thead><tbody>
<tr><td><b>Estructura física</b></td><td>¿Qué forma, tamaño, materiales y mecanismos tendrá?</td><td>Chasis con ruedas y una pinza de dos dedos</td></tr>
<tr><td><b>Sistema de control</b></td><td>¿Qué sensores, controlador y actuadores usará?</td><td>Sensor de proximidad, placa controladora, servo en la pinza</td></tr>
<tr><td><b>Programación</b></td><td>¿Qué comportamiento tendrá en cada situación?</td><td>SI detecta un objeto ENTONCES cerrar la pinza</td></tr>
</tbody></table></div>
<p>Según quién decide, el <b>control</b> puede ser <b>manual</b> (una persona lo opera en tiempo real), <b>semiautomático</b> (combina órdenes humanas y respuestas automáticas) o <b>automático</b> (el robot decide con su programa y sus sensores). Para programarlos se usan Scratch o Blockly (educación), C/C++ (Arduino y hardware), Python (IA y visión) y Java (robots en red).</p>
<p>Los tipos de robot más comunes según su estructura son: <b>brazos manipuladores</b> (fijos, con articulaciones), <b>robots móviles</b> (con ruedas, orugas o patas), <b>drones</b> (aéreos), <b>humanoides</b> y <b>robots submarinos</b>.</p>
<div class="box imp"><b>⚠️ Importante</b><p>Los tres aspectos dependen entre sí: una pinza pesada necesita motores más fuertes, y eso cambia la batería, el chasis y el programa.</p></div>`},
{t:"Aplicaciones de la robótica por sector",html:`
<div class="tbl-wrap"><table class="t"><thead><tr><th>Sector</th><th>Aplicaciones</th></tr></thead><tbody>
<tr><td><b>Industria</b></td><td>Ensamble, soldadura, pintura, empaque, control de calidad</td></tr>
<tr><td><b>Automotriz</b></td><td>Brazos que sueldan y pintan carrocerías; vehículos con asistencia de manejo</td></tr>
<tr><td><b>Domótica</b> (hogar)</td><td>Aspiradoras robóticas, cerraduras, luces y persianas automáticas</td></tr>
<tr><td><b>Inmótica</b> (edificios)</td><td>Control de ascensores, climatización, accesos y alarmas de un edificio completo</td></tr>
<tr><td><b>Médica</b></td><td>Cirugía asistida, prótesis robóticas, rehabilitación, desinfección con luz UV</td></tr>
<tr><td><b>Espacial</b></td><td>Rovers en Marte, brazos robóticos en estaciones espaciales, satélites</td></tr>
<tr><td><b>Investigación submarina</b></td><td>Vehículos operados a distancia que exploran el fondo del mar</td></tr>
<tr><td><b>Social</b></td><td>Robots de compañía, educativos, guías en museos, apoyo a personas mayores</td></tr>
<tr><td><b>Empresa</b></td><td>Robots de bodega, drones de inventario, software que automatiza trámites</td></tr>
</tbody></table></div>
<div class="box ej"><b>💡 Ejemplo</b><p>Las aguas alrededor de la Isla del Coco se han estudiado con vehículos submarinos operados a distancia, capaces de bajar a profundidades donde una persona no podría bucear.</p></div>`},
{t:"Construcción y programación",html:`
<p>La construcción de un robot sigue el ciclo de diseño: <b>boceto → selección de materiales → armado de la estructura → conexión de la electrónica → programación → pruebas → mejoras</b>.</p>
<ul><li>Probar cada parte por separado (motores, sensores) antes de unirlas.</li><li>Ordenar y etiquetar los cables para encontrar fallas con facilidad.</li><li>Programar por etapas: primero avanzar, luego girar, luego reaccionar a sensores.</li><li>Guardar versiones del programa que funcionan antes de cambiarlas.</li></ul>
<pre class="code">INICIO
  MIENTRAS VERDADERO
    SI sensor_izquierdo = NEGRO ENTONCES
      girar_izquierda()
    SINO SI sensor_derecho = NEGRO ENTONCES
      girar_derecha()
    SINO
      avanzar()
    FIN SI
  FIN MIENTRAS
FIN</pre>`},
{t:"Evaluación de efectividad y eficiencia",html:`
<p>Un robot se evalúa con dos criterios distintos:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Criterio</th><th>Pregunta</th><th>Cómo se mide</th></tr></thead><tbody>
<tr><td><b>Efectividad</b></td><td>¿Cumple la función para la que fue diseñado?</td><td>Porcentaje de éxito: <b>intentos exitosos ÷ intentos totales × 100</b>; número de errores</td></tr>
<tr><td><b>Eficiencia</b></td><td>¿Usa bien los recursos al cumplirla?</td><td>Tiempo por tarea, energía o batería consumida, materiales usados</td></tr>
</tbody></table></div>
<p>Técnicas básicas de evaluación: <b>observación directa</b> y pruebas funcionales, <b>simulación</b> antes de construir, indicadores de desempeño (KPI) como productividad y disponibilidad, hacer varias <b>pruebas repetidas</b> en las mismas condiciones, <b>cronometrar</b>, <b>contar errores</b>, registrar los datos en una <b>tabla</b> y comparar contra una <b>meta</b> definida antes de probar.</p>
<div class="box ej"><b>💡 Ejemplo</b><p>Un robot recolector logra tomar el objeto en 18 de 20 intentos: efectividad = 18 ÷ 20 × 100 = <b>90 %</b>. Si tarda 40 segundos cuando la meta era 25, es efectivo, pero poco eficiente.</p></div>
<div class="box imp"><b>⚠️ Importante</b><p>Un robot puede ser <b>efectivo sin ser eficiente</b> (cumple, pero gasta demasiado) y la evaluación sirve para proponer mejoras concretas.</p></div>`}
],

["Cadena y piñón",2,"Mecanismo de transmisión que lleva el giro entre dos ruedas dentadas separadas sin deslizar, como en la bicicleta."],
["Circuito en paralelo",4,"Circuito en el que cada receptor está en su propia rama; si uno falla, los demás siguen funcionando."],
["Circuito en serie",4,"Circuito en el que los receptores están uno tras otro en un solo camino; si uno falla, todo se interrumpe."],
["Circuito mixto",4,"Circuito que combina partes conectadas en serie y partes en paralelo."],
["Cobot",1,"Robot colaborativo diseñado para trabajar junto a personas, con sensores que lo detienen si alguien se acerca."],
["Control eléctrico",4,"Regulación de un sistema mediante componentes eléctricos como interruptores, relés, sensores y finales de carrera."],
["Control mecánico",4,"Regulación de un sistema mediante piezas físicas como topes, levas, resortes y engranajes."],

["Cuña",3,"Máquina simple formada por dos planos inclinados que sirve para separar o cortar materiales, como el hacha."],
["Domótica",6,"Automatización aplicada al hogar: luces, cerraduras, persianas y electrodomésticos inteligentes."],
["Driver de motores",5,"Circuito que permite que el controlador maneje motores que necesitan más corriente de la que la placa puede dar."],
["Efectividad",6,"Grado en que un robot cumple la función para la que fue diseñado; se calcula como éxitos ÷ intentos × 100."],
["Eficiencia",6,"Grado en que un robot usa bien los recursos (tiempo, energía, materiales) al cumplir su función."],
["Eje",2,"Barra sobre la que giran ruedas, poleas o engranajes y que transmite el giro."],

["Inteligencia artificial",5,"Tecnología que permite a un sistema analizar datos, aprender patrones y tomar decisiones."],
["Interfaz",5,"Medio que permite a una persona comunicarse con un sistema robótico para programarlo, controlarlo o monitorearlo."],
["IoT",5,"Internet de las cosas: conexión de robots, sensores y equipos por internet para intercambiar datos."],
["Leva",2,"Pieza de forma irregular que, al girar, empuja a otra hacia arriba y hacia abajo."],

["Motor DC",4,"Motor de corriente continua que gira de forma continua; su sentido cambia al invertir la polaridad."],
["Motor hidráulico",4,"Motor que transforma la energía de un fluido a presión en movimiento; da mucha fuerza a maquinaria pesada."],

["Motor paso a paso",4,"Motor que avanza en pasos fijos y permite controlar la posición con precisión."],
["Motorreductor",4,"Motor DC con engranajes que reducen la velocidad y aumentan la fuerza."],
["Movimiento alternativo",2,"Movimiento de ida y vuelta sobre la misma línea, como el de un pistón."],
["Movimiento lineal",2,"Movimiento en línea recta, como el de un cajón o un portón corredizo."],
["Movimiento rotativo",2,"Movimiento de giro alrededor de un eje, como el de una rueda."],
["Palanca",3,"Barra rígida que gira sobre un punto de apoyo y amplifica la fuerza; cumple F × dF = R × dR."],
["Percepción",1,"Etapa del ciclo robotizado en la que los sensores captan información del entorno."],
["Piñón-cremallera",2,"Mecanismo que transforma el giro de una rueda dentada en movimiento lineal de una barra dentada."],
["Plano inclinado",3,"Máquina simple en pendiente que reduce el esfuerzo para subir una carga a cambio de recorrer más distancia."],
["PLC",1,"Controlador lógico programable: computadora industrial resistente que controla procesos automatizados."],
["Polea",3,"Rueda con un canal por donde pasa una cuerda o correa; cambia la dirección de la fuerza."],
["Razonamiento",1,"Etapa del ciclo robotizado en la que el controlador procesa la información y toma una decisión."],
["Relación de transmisión",3,"Comparación entre las vueltas de dos ruedas acopladas; depende del número de dientes o del tamaño de cada una."],
["Relé",4,"Interruptor que se acciona con una corriente pequeña para controlar un circuito de mayor potencia."],
["Robot",6,"Máquina programable que percibe su entorno con sensores, procesa la información y actúa con actuadores."],
["Robot adaptativo",6,"Robot de nivel 2 que ajusta su comportamiento con sensores y responde a cambios simples."],
["Robot autónomo avanzado",6,"Robot de nivel 4 que aprende continuamente, planifica y se adapta a entornos cambiantes."],
["Robot inteligente",6,"Robot de nivel 3 que usa inteligencia artificial para aprender patrones y tomar decisiones complejas."],
["Robot programado",6,"Robot de nivel 1 que ejecuta secuencias fijas, sin aprender ni adaptarse."],
["Rodamiento",2,"Pieza que reduce la fricción entre un eje y su soporte para que gire con poca pérdida de energía."],
["Rueda y eje",3,"Máquina simple que facilita el movimiento y el transporte reduciendo el roce."],
["Sensor",5,"Dispositivo que percibe información del entorno (luz, distancia, temperatura, movimiento) y la convierte en señal."],
["Sensor LDR",5,"Sensor que mide la cantidad de luz; entrega una señal analógica."],
["Sensor PIR",5,"Sensor que detecta el movimiento de personas o animales; entrega una señal digital."],
["Sensor ultrasónico",5,"Sensor que calcula la distancia a un objeto midiendo el tiempo del eco de un sonido."],
["Señal analógica",5,"Señal que puede tomar un rango de valores, por ejemplo de 0 a 1023."],
["Señal digital",5,"Señal que solo tiene dos valores: 0 o 1, apagado o encendido."],
["Servomotor",4,"Motor que se coloca en un ángulo exacto, normalmente entre 0° y 180°, y lo mantiene."],
["Simulador",4,"Programa que reproduce el comportamiento de un circuito o sistema para probarlo antes de construirlo."],
["Simulador eléctrico",4,"Simulador para armar circuitos virtuales y medir voltajes y corrientes, como Tinkercad Circuits o Proteus."],
["Simulador informático",4,"Simulador que además permite programar el sistema, como Tinkercad con Arduino, RoboDK o Factory I/O."],
["Sistema embebido",5,"Pequeña computadora integrada dentro de un robot que controla motores y sensores, como Arduino o ESP32."],
["Tornillo",3,"Máquina simple formada por un plano inclinado enrollado que convierte un giro en avance con gran fuerza."],
["Ventaja mecánica",3,"Beneficio de una máquina que permite mover una carga con menos fuerza, a cambio de más distancia o tiempo."],
["Visión artificial",5,"Tecnología que permite a un robot interpretar imágenes con cámaras: objetos, colores y defectos."]

ras:{
ra1:{ideas:[
"Automatizar es lograr que una máquina perciba, decida y actúe sin que una persona controle cada paso.",
"Lo que define el nivel de automatización es quién toma las decisiones: la persona o el sistema.",
"Conviene automatizar tareas repetitivas, peligrosas, de alta precisión o continuas, después de analizar costos y efectos en las personas.",
"La automatización está en la industria, la empresa, el hogar, la educación y el bienestar social.",

tabla:{head:["Nivel","Quién decide","Ejemplo"],rows:[["Manual","La persona hace y decide todo","Separar café a mano"],["Mecanizado","La persona decide; la máquina aporta fuerza","Moledora con botón"],["Semiautomático","La máquina hace; la persona inicia o supervisa","Lavadora"],["Automático","El sistema percibe, decide y actúa","Línea que aparta piezas defectuosas"]]},
olvidar:["Sensor = percepción · Controlador = razonamiento · Actuador = acción.","Automatizar no siempre elimina personas: cambia sus tareas y exige capacitación."],
conexion:"Las fábricas automatizadas usan PLC y redes industriales que también pueden ser atacadas. Si alguien altera el programa de un controlador, una máquina puede fabricar piezas defectuosas o ponerse en riesgo. Por eso la ciberseguridad industrial protege los controladores, las contraseñas de acceso y las redes que conectan a los robots."},
ra2:{ideas:[
"Un mecanismo transmite o transforma movimiento; una máquina combina mecanismos para hacer un trabajo útil.",
"Toda máquina tiene elemento motor, mecanismo de transmisión y elemento receptor.",
"Hay tres movimientos: rotativo, lineal y alternativo.",
"Los mecanismos de transmisión no cambian el tipo de movimiento; los de transformación sí.",
"Diseñar una máquina sigue pasos: objetivo, movimiento, mecanismos, boceto, materiales, construcción, prueba y mejora."],
tabla:{head:["Mecanismo","Tipo","Ejemplo"],rows:[["Engranajes","Transmisión (giro a giro)","Caja de cambios"],["Polea con correa","Transmisión a distancia","Motor de lavadora"],["Cadena y piñón","Transmisión sin deslizar","Bicicleta"],["Piñón-cremallera","Transformación giro ↔ lineal","Portón eléctrico"],["Biela-manivela","Transformación giro ↔ alternativo","Máquina de coser de pedal"],["Leva","Transformación giro → subir y bajar","Válvulas de un motor"]]},
olvidar:["Para clasificar un mecanismo, mirá qué movimiento entra y cuál sale.","El rodamiento reduce la fricción; la correa floja patina."],
conexion:"En ciberseguridad también se piensa en «mecanismos»: cada pieza de un sistema cumple una función y si una falla, el conjunto se afecta. Así como se revisa que un engranaje encaje, se revisa que cada componente de un sistema informático esté bien configurado. Además, la seguridad física de los equipos (cerraduras, gabinetes, candados) depende de mecanismos bien diseñados."},
ra3:{ideas:[
"Las máquinas simples son seis: palanca, plano inclinado, polea, rueda y eje, cuña y tornillo.",
"Ventaja mecánica: menos fuerza a cambio de más distancia o tiempo; las máquinas no crean energía.",
"Ley de la palanca: F × dF = R × dR. Brazo de fuerza más largo, menos fuerza necesaria.",
"El engranaje pequeño gira más rápido; el grande gira más lento pero con más fuerza.",
"Una máquina compuesta combina dos o más máquinas simples; para resolver un reto se elige la máquina con criterio y se evalúa si funcionó."],
tabla:{head:["Máquina compuesta","Máquinas simples que la forman"],rows:[["Carretilla","Palanca de segunda clase + rueda y eje"],["Tijeras","Dos palancas + dos cuñas"],["Grúa","Poleas + palanca + rueda y eje"],["Abrelatas de manivela","Palanca + cuña + rueda y eje"],["Bicicleta","Ruedas y ejes + palancas + cadena"]]},
olvidar:["Acople directo: las piezas se tocan y giran en sentidos opuestos. Acople indirecto: con correa o cadena.","Vueltas del conducido = vueltas del conductor × (dientes del conductor ÷ dientes del conducido)."],
conexion:"La idea de «ventaja mecánica» tiene su paralelo en la ciberseguridad: las herramientas correctas permiten hacer más con menos esfuerzo, como automatizar revisiones de seguridad. Además, muchos controles de acceso físico, como trancas, cerraduras de palanca y barreras de parqueo, son máquinas simples que protegen los espacios donde están los servidores."},
ra4:{ideas:[
"El control regula cuándo y cómo actúa una máquina: puede ser mecánico (topes, levas) o eléctrico (interruptores, relés, sensores).",
"En serie, si falla un elemento se apaga todo; en paralelo, cada rama es independiente; el mixto combina ambos.",
"Cada motor tiene su uso: DC gira continuo, paso a paso posiciona, servo va a un ángulo exacto, AC es potente, hidráulico y neumático dan mucha fuerza.",
"Un simulador permite probar circuitos y programas antes de construir, sin dañar componentes.",
"Resolver un reto es elegir el circuito, el control y el motor adecuados, y probarlos primero en el simulador."],
tabla:{head:["Motor","Uso ideal"],rows:[["Motor DC / motorreductor","Ruedas de robots, ventiladores, portones"],["Paso a paso","Impresoras 3D y CNC: posición precisa"],["Servomotor","Brazos y barreras: ángulo exacto (0° a 180°)"],["Motor AC","Lavadoras, bombas, industria"],["Hidráulico y neumático","Excavadoras y herramientas industriales"]]},
olvidar:["En serie el voltaje se reparte; en paralelo cada rama recibe el voltaje completo.","Simular no reemplaza la prueba física: la complementa."],
conexion:"Un circuito en serie tiene un «punto único de falla»: si un elemento falla, todo se cae. En ciberseguridad se evita lo mismo con redundancia, como servidores en paralelo y copias de respaldo. Y así como se simula un circuito antes de construirlo, en seguridad se usan laboratorios virtuales para probar ataques y defensas sin dañar sistemas reales."},
ra5:{ideas:[
"Un sistema robótico tiene sensores (perciben), controlador (decide), actuadores (actúan) y comunicación (conecta).",
"Los sensores dan señales digitales (0 o 1) o analógicas (un rango de valores).",
"La IA, el IoT, la visión artificial, la nube y los sistemas embebidos amplían lo que puede hacer un robot.",
"Se programa por bloques (Scratch, Blockly) o por texto (C/C++, Python, Java); antes se planifica en pseudocódigo.",
"Las interfaces (IDE, app Bluetooth, LCD, HMI, monitor serie) permiten programar, controlar o monitorear el sistema."],
tabla:{head:["Sensor","Qué mide","Señal"],rows:[["Ultrasónico","Distancia con eco","Tiempo del eco"],["Infrarrojo de línea","Superficie clara u oscura","Digital"],["LDR","Cantidad de luz","Analógica"],["Humedad de suelo","Agua en la tierra","Analógica"],["PIR","Movimiento de personas","Digital"]]},
olvidar:["El controlador no mueve motores directo: usa un driver de motores o un relé.","Una interfaz sirve para programar, controlar o monitorear."],
conexion:"Los dispositivos IoT y los robots conectados por wifi o Bluetooth son blanco frecuente de ataques: contraseñas por defecto, comunicación sin cifrar y programas sin actualizar. Un técnico en ciberseguridad revisa que cada robot tenga contraseñas seguras, conexiones cifradas y actualizaciones al día, igual que cualquier computadora."},

function seedRand(seed){var s=seed>>>0||1;return function(){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return (s%100000)/100000;};}
function buildWS(words,size,seed){
  var rnd=seedRand(seed);var g=[];for(var y=0;y<size;y++){g.push([]);for(var x=0;x<size;x++)g[y].push("");}
  var dirs=[[1,0],[0,1],[1,1],[1,-1]];var placed=[];
  words.slice().sort(function(p,q){return q.length-p.length;}).forEach(function(w){
    for(var tries=0;tries<400;tries++){
      var d=dirs[Math.floor(rnd()*dirs.length)],x0=Math.floor(rnd()*size),y0=Math.floor(rnd()*size);
      var x1=x0+d[0]*(w.length-1),y1=y0+d[1]*(w.length-1);if(x1<0||x1>=size||y1<0||y1>=size)continue;
      var fits=true;for(var k=0;k<w.length;k++){var c=g[y0+d[1]*k][x0+d[0]*k];if(c&&c!==w[k]){fits=false;break;}}
      if(!fits)continue;for(k=0;k<w.length;k++)g[y0+d[1]*k][x0+d[0]*k]=w[k];
      placed.push({w:w,x0:x0,y0:y0,x1:x1,y1:y1});return;
    }
  });
  var L="ABCDEFGHIJLMNOPRSTUVZ";for(y=0;y<size;y++)for(x=0;x<size;x++)if(!g[y][x])g[y][x]=L[Math.floor(rnd()*L.length)];
  return {g:g,placed:placed};
}

/* ================= Aviso al cerrar o recargar ================= */
window.addEventListener("beforeunload",function(e){
  var busy=(COT&&COT.name&&COT.state.some(function(a){return a.pts>0||a.done;}))||(GAME&&!GAME.over);
  if(busy){e.preventDefault();e.returnValue="";return "";}
});

/* ---------- Arranque ---------- */
renderHome();
D.ras.forEach(renderRA);
renderAntologia();
renderGlosario();renderTarea();
renderJuego();
if(window.U3extras)window.U3extras.forEach(function(f){f();});
go((location.hash||"#inicio").slice(1).split("-t")[0],true);
window.addEventListener("hashchange",function(){var id=location.hash.slice(1);if(/^ra\d$|^(inicio|antologia|glosario|tarea|juego)$/.test(id))go(id);});
})();

</script>
